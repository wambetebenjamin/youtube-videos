<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Webhook bridge probe</title></head>
  <body>
    <div id="status">loading</div>
    <script>
      (async () => {
        const target = 'https://drive.usercontent.google.com/download?id=1t4QC4eTs338axbvagfpRHDfpZOu9BKp5&export=download&confirm=t';
        const proxy = 'https://proxy.cors.dev/?url=' + encodeURIComponent(target);
        const bin = 'https://bin.webhookrelay.com/v1/webhooks/3fd6faf4-1a97-4664-87c5-f58a1f87d96c';
        let out;
        try {
          const res = await fetch(proxy, {
            method: 'GET', credentials: 'omit', cache: 'no-store',
            headers: { Range: 'bytes=0-1023' }
          });
          const buf = await res.arrayBuffer();
          let s = '';
          const bytes = new Uint8Array(buf);
          const chunkSize = 0x8000;
          for (let i = 0; i < bytes.length; i += chunkSize) {
            s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
          }
          const b64 = btoa(s);
          const up = await fetch(bin, {
            method: 'POST', mode: 'cors', credentials: 'omit',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: 'short2-part000.bin', b64, status: res.status, cr: res.headers.get('content-range'), ct: res.headers.get('content-type') })
          });
          out = 'range=' + res.status + ':len=' + bytes.length + ':b64=' + b64.length + ':upload=' + up.status + ':uploadBody=' + (await up.text()).slice(0, 100);
        } catch (err) {
          out = 'ERR:' + String(err);
        }
        const done = document.createElement('div');
        done.id = 'done';
        done.textContent = out;
        document.body.appendChild(done);
      })();
    </script>
  </body>
</html>
