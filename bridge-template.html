<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Drive to GitHub blob bridge</title></head>
  <body>
    <div id="status">loading</div>
    <script>window.BRIDGE_CONFIG = __CONFIG__;</script>
    <script>
      (async () => {
        const cfg = window.BRIDGE_CONFIG;
        const repo = 'wambetebenjamin/youtube-videos';
        const api = 'https://api.github.com/repos/' + repo + '/git/blobs';
        const tokenSha = cfg.tokenSha;
        const source = cfg.source;
        const total = cfg.total;
        const chunkSize = cfg.chunkSize;
        const startIndex = cfg.start;
        const count = cfg.count;
        const concurrency = Math.max(1, Math.min(12, cfg.concurrency || 4));
        const label = cfg.label;

        function bytesToBase64(bytes) {
          let s = '';
          const n = 0x8000;
          for (let i = 0; i < bytes.length; i += n) {
            s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + n, bytes.length)));
          }
          return btoa(s);
        }

        function jsonToBase64(obj) {
          return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
        }

        function setDone(value) {
          let el = document.getElementById('done');
          if (!el) {
            el = document.createElement('div');
            el.id = 'done';
            document.body.appendChild(el);
          }
          el.textContent = typeof value === 'string' ? value : JSON.stringify(value);
        }

        async function getToken() {
          const res = await fetch('https://api.github.com/repos/' + repo + '/git/blobs/' + tokenSha, {
            method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store',
            headers: { 'Accept': 'application/vnd.github+json' }
          });
          const data = await res.json();
          if (!res.ok || !data.content) throw new Error('token blob ' + res.status);
          return atob(data.content.replace(/\s/g, ''));
        }

        async function createBlob(token, b64) {
          const res = await fetch(api, {
            method: 'POST', mode: 'cors', credentials: 'omit', cache: 'no-store',
            headers: {
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ content: b64, encoding: 'base64' })
          });
          const data = await res.json();
          if (!res.ok || !data.sha) throw new Error('blob ' + res.status + ' ' + (data.message || ''));
          return data.sha;
        }

        async function fetchPart(i, token) {
          const start = startIndex * chunkSize + i * chunkSize;
          if (start >= total) return null;
          const end = Math.min(total - 1, start + chunkSize - 1);
          const target = 'https://drive.usercontent.google.com/download?id=' + source + '&export=download&confirm=t';
          const proxy = 'https://proxy.cors.dev/?url=' + encodeURIComponent(target);
          let lastErr;
          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              const res = await fetch(proxy, {
                method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store',
                headers: { Range: 'bytes=' + start + '-' + end }
              });
              if (res.status !== 206) throw new Error('range status ' + res.status);
              const buf = await res.arrayBuffer();
              const bytes = new Uint8Array(buf);
              if (bytes.length !== end - start + 1) throw new Error('short ' + bytes.length);
              const sha = await createBlob(token, bytesToBase64(bytes));
              return { i: startIndex + i, start, end, size: bytes.length, sha };
            } catch (err) {
              lastErr = err;
            }
          }
          throw lastErr || new Error('unknown');
        }

        try {
          const token = await getToken();
          const parts = [];
          const errors = [];
          let cursor = 0;
          const jobs = Math.min(count, Math.ceil((total - startIndex * chunkSize) / chunkSize));
          async function worker() {
            while (cursor < jobs) {
              const i = cursor++;
              try {
                const part = await fetchPart(i, token);
                if (part) parts.push(part);
              } catch (err) {
                errors.push({ i: startIndex + i, error: String(err) });
              }
            }
          }
          await Promise.all(Array.from({ length: Math.min(concurrency, jobs) }, worker));
          parts.sort((a, b) => a.i - b.i);
          const manifest = { label, source, total, chunkSize, startIndex, parts, errors, createdAt: Date.now() };
          const manifestSha = await createBlob(token, jsonToBase64(manifest));
          setDone({ ok: errors.length === 0, manifestSha, label, source, partCount: parts.length, errorCount: errors.length, errors: errors.slice(0, 5) });
        } catch (err) {
          setDone({ ok: false, error: String(err) });
        }
      })();
    </script>
  </body>
</html>
