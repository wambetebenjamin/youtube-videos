<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Upload probe</title></head>
  <body>
    <div id="status">loading</div>
    <script>
      (async () => {
        const sessions = [
          {
            name: 'noauth',
            uri: 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=True&upload_id=AFy3sg1FQIzp6BoZ21xdmCH27DGXsQOeA4AggwncDW1UfTYnwbcnNUp7S8HdHG3Vmb_pv53KvG0uH_LeQffX6XrFp5mGIutVwjvWJpt7Yz8SY_U',
            crd: ''
          },
          {
            name: 'bearer',
            uri: 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=True&upload_id=AFy3sg1pKRWVHOpbjLk4aGtifTMtG1f0nULsFhyX3smx7y6d-3iAfBkhGsVBBbU5VNbaKbjIrp9vMwE6wIMUVfbl6eDh7yuVYymY6SSt4o6Zfg',
            crd: 'AHSoBRXt099SM3KMkZYP2lrYdi1rnKWmQmJTucV054gXQtNZBm9_qmc0k5hscX45tIOs_40rYWIFiqEeFw0'
          }
        ];
        const results = [];
        const body = new TextEncoder().encode('HELLO_RANGE!');
        for (const s of sessions) {
          try {
            const headers = {
              'Content-Type': 'application/octet-stream',
              'X-Goog-Upload-Command': 'upload, finalize',
              'X-Goog-Upload-Offset': '0',
              'X-Goog-Upload-Total-Size': String(body.length)
            };
            if (s.crd) headers.Authorization = 'Bearer ' + s.crd;
            const res = await fetch(s.uri, {
              method: 'PUT',
              mode: 'cors',
              credentials: 'omit',
              headers,
              body
            });
            const text = await res.text();
            results.push(s.name + ':' + res.status + ':status=' + (res.headers.get('x-goog-upload-status') || '') + ':url=' + (res.headers.get('x-goog-upload-url') || '') + ':body=' + text.slice(0, 200));
          } catch (err) {
            results.push(s.name + ':ERR:' + String(err));
          }
        }
        const done = document.createElement('div');
        done.id = 'done';
        done.textContent = results.join(' | ');
        document.body.appendChild(done);
      })();
    </script>
  </body>
</html>
