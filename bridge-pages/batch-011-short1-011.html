(async () => {

  const proxy = 'https://proxy.cors.dev/?url=' + encodeURIComponent(target);
  const results = [];
  const errors = [];
  let cursor = 0;
  const concurrency = Math.min(8, jobs.parts.length);
  async function worker() {
    while (cursor < jobs.parts.length) {
      const j = jobs.parts[cursor++];
      let lastErr;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const res = await fetch(proxy, {
            method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store',
            headers: { Range: 'bytes=' + j.start + '-' + j.end }
          });
          if (res.status !== 206) throw new Error('range ' + res.status);
          const buf = await res.arrayBuffer();
          const bytes = new Uint8Array(buf);
          if (bytes.length !== j.end - j.start + 1) throw new Error('short ' + bytes.length);
          const form = new FormData();
          form.append('file', new Blob([bytes], { type: 'application/octet-stream' }), 'part.bin');
          const up = await fetch(j.uploadUrl, {
            method: 'POST', mode: 'cors', credentials: 'omit', body: form
          });
          if (!up.ok) throw new Error('upload ' + up.status + ' ' + (await up.text()).slice(0,100));
          results.push({ i: j.i, size: bytes.length });
          lastErr = null;
          break;
        } catch (err) { lastErr = err; }
      }
      if (lastErr) errors.push({ i: j.i, error: String(lastErr) });
    }
  }
  let summary;
  try {
    await Promise.all(Array.from({ length: concurrency }, worker));
    results.sort((a,b) => a.i - b.i);
    summary = { ok: errors.length === 0, label: jobs.label, count: results.length, expected: jobs.parts.length, errors: errors.slice(0,10) };
  } catch (err) {
    summary = { ok: false, fatal: String(err), count: results.length, errors: errors.slice(0,10) };
  }
  const done = document.createElement('div');
  done.id = 'done';
  done.textContent = JSON.stringify(summary);
  document.body.appendChild(done);
  document.getElementById('status').remove();
})();
