<!doctype html>
<html>
  <head><meta charset="utf-8"><title>GitHub blob probe</title></head>
  <body>
    <div id="status">loading</div>
    <script>
      (async () => {
        const payload = {
          content: btoa('HELLO_DRIVE_RANGE_BRIDGE'),
          encoding: 'base64'
        };
        let out;
        try {
          const res = await fetch('https://api.github.com/repos/wambetebenjamin/youtube-videos/git/blobs', {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          out = 'status=' + res.status + ' sha=' + (data.sha || '') + ' msg=' + (data.message || '');
        } catch (err) {
          out = 'ERR:' + String(err);
        }
        const done = document.createElement('div');
        done.id = 'done';
        done.textContent = out;
        document.body.appendChild(done);
      })();
    </script>
  </body>
</html>
