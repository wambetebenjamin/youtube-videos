name: Fetch Pixabay & Build Reels
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/d58bab72-youtube-videos }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && pip install imageio-ffmpeg
      - env: { PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }} }
        run: node scripts/fetch-pixabay-videos.mjs --out public/reels/raw/
      - run: node scripts/build-reels-VIDEO-bg.mjs
      - run: |
          git config user.name arena-bot
          git config user.email arena@bot
          git add public/reels/raw/pixabay-*.mp4 out/reels-video/*.mp4
          git commit -m "feat: Pixabay portrait stock (content/music intact, fading 2s)" || true
          git push
